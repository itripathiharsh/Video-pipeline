name: Deploy to EC2

on:
  push:
    branches:
      - video-pipeline  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/app
            git fetch
            git checkout video-pipeline
            git reset --hard origin/video-pipeline
            pip3 install -r requirements.txt
            sudo systemctl restart video-pipeline